<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard | Kailash Properties</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css"></head><body class="admin-body"><header class="dash-header"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><b>KAILASH</b><small>PROPERTIES</small></span></a><div><span class="owner-label">OWNER DASHBOARD</span><button id="logoutBtn" class="outline-button">Log out</button></div></header><main class="dashboard"><div class="dash-title"><div><p class="eyebrow">PROPERTY MANAGEMENT</p><h1>Manage listings.</h1><p class="muted">Add, update, publish or remove properties from your website.</p></div><button id="newPropertyBtn" class="button gold-button">＋ Add property</button></div><section class="stats"><div><small>TOTAL LISTINGS</small><b id="totalCount">0</b></div><div><small>PUBLISHED</small><b id="publishedCount">0</b></div><div><small>DRAFTS</small><b id="draftCount">0</b></div></section><section class="editor" id="editor"><h2 id="formTitle">Add a property</h2><form id="propertyForm"><input type="hidden" id="propertyId"><div class="form-grid"><label>Property title<input id="title" required placeholder="e.g. Premium 3 BHK Apartment"></label><label>Category<select id="category" required><option>Residential</option><option>Commercial</option><option>Plots & Land</option></select></label><label>Purpose<select id="purpose" required><option>Buy</option><option>Rent</option><option>Sell</option></select></label><label>Location<input id="location" required placeholder="e.g. Golf Course Road, Gurgaon"></label><label>Price display<input id="priceText" placeholder="e.g. ₹1.8 Cr / ₹45,000 per month"></label><label>Cover photo<input id="photo" type="file" accept="image/*"></label><label class="wide">Description<textarea id="description" rows="4" placeholder="Property details, size, amenities..."></textarea></label><label class="check-label"><input id="published" type="checkbox"> Publish on public website</label></div><div class="form-actions"><button class="button gold-button" type="submit">Save property</button><button class="outline-button" type="button" id="cancelEdit">Cancel</button><span id="formMessage" class="form-message"></span></div></form></section><section><div class="list-heading"><h2>Your properties</h2><span class="muted">Only published listings appear publicly.</span></div><div id="adminListings" class="admin-list"><p class="muted">Loading listings…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="dashboard.js"></script></body></html>
